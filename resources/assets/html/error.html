<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>出错了</title>
    <style>
      body {
        margin: 0;
      }
      img {
        width: 160px;
        height: 160px;
        display: block;
        margin: 160px auto 0;
      }

      p {
        font-size: 16px;
        color: #9ca6bb;
        line-height: 24px;
        text-align: center;
      }

      p:first-of-type {
        margin: 8px 0;
      }

      p:last-of-type {
        margin: 0;
      }

      div {
        margin: 104px auto 0;
        width: 255px;
        height: 40px;
        border-radius: 4px;
        border: 1Px solid #c0c8d4;
        font-size: 16px;
        color: #283044;
        line-height: 40px;
        text-align: center;
      }
    </style>
</head>
<body>
<main>
    <img src="./error_files/5xx.png" alt="" />
    <p>网络状况差</p>
    <p>请在稳定的网络环境下重新尝试</p>
    <div onclick="retry()" class="btn">重试</div>
</main>
<script>
      window.onload = function() {
        window.bcz_system.setShareState('{visibility:false}')
      }

      function retry() {
        window.bcz_system.retry()
        var body = document.getElementById('main')
        var childs = body.getElementsByTagName('div')
        body.removeChild(childs[0])
      }
    </script>
</body>
</html>
