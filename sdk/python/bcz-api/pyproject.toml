[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "bcz-api"
version = "0.1.0"
description = "Python SDK for 百词斩 (BCZ) API"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["baicizhan", "bcz", "thrift", "sdk", "vocabulary"]
dependencies = ["requests>=2.28.0"]

[project.urls]
Repository = "https://github.com/9xhk-1/bcz-source"

[tool.setuptools.packages.find]
where = ["."]
include = ["bcz*"]
